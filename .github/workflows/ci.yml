name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  app:
    name: App
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          cache: npm
      - name: Use pinned npm version
        run: npm install --global npm@11.13.0
      - run: npm ci
      - run: npm test
        timeout-minutes: 8
      - run: npm run build
      - run: npx tsc --noEmit

  database:
    name: Database
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install PostgreSQL
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql postgresql-client libpq-dev
      - name: Run isolated database tests
        run: bash tests/security/run.sh
